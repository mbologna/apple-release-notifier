name: CI

"on":
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  python:
    uses: mbologna/.github/.github/workflows/python-ci.yml@31ef9e1806fb2404b1e83e71cdb3838a2c56b5c1 # main
    with:
      python_version: "3.14"
      use_uv: true
      enable_codecov: false
    secrets: inherit

  docker:
    needs: python
    uses: mbologna/.github/.github/workflows/docker-ci.yml@31ef9e1806fb2404b1e83e71cdb3838a2c56b5c1 # main
    with:
      image_name: apple-release-notifier
      push_to_dockerhub: true
      enable_cosign: true
      enable_release_drafter: true
    secrets: inherit

  auto-release:
    # Monday's schedule and a manual run release with the strategy below; a push
    # to the default branch releases only a CVE fix (the wrapper switches to the
    # security strategy). The tag build auto-release dispatches runs on the tag
    # ref, so it does not release again.
    if: >-
      github.event_name == 'schedule' ||
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: [docker]
    # contents: push the tag and create the Release; actions: dispatch this
    # workflow on it, since a tag pushed with GITHUB_TOKEN triggers no run.
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@31ef9e1806fb2404b1e83e71cdb3838a2c56b5c1 # main
    with:
      strategy: docker
      image: docker.io/mbologna/apple-release-notifier
    secrets: inherit

  # Points the Cloud Run job at this commit's image. Terraform owns the job
  # (schedule, env, state bucket) and ignores the image after the first apply.
  deploy:
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: mbologna/.github/.github/workflows/gcp-deploy.yml@31ef9e1806fb2404b1e83e71cdb3838a2c56b5c1 # main
    with:
      image_name: apple-release-notifier
      deploy_type: job
      deploy_name: apple-release-notifier
      region: us-central1
    secrets: inherit

  cache-cleanup:
    if: github.event_name == 'schedule'
    uses: mbologna/.github/.github/workflows/cache-cleanup.yml@31ef9e1806fb2404b1e83e71cdb3838a2c56b5c1 # main
    with:
      max_age_days: 7
    permissions:
      actions: write
