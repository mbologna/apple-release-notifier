name: CI

"on":
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  python:
    uses: mbologna/.github/.github/workflows/python-ci.yml@4ab7563caf5d7d861f5275163417627e38eecc0e # main
    with:
      python_version: "3.15"
      use_uv: true
      enable_codecov: false
    secrets: inherit

  docker:
    needs: python
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: write
    uses: mbologna/.github/.github/workflows/docker-ci.yml@f73dea0e67106487f3d2d1a368845904da2846b9 # test
    with:
      image_name: apple-release-notifier
      # push: the deploy job below runs the sha-* image of each
      # main build, so main keeps publishing.
      publish: push
      release_strategy: conventional
      release_image: docker.io/mbologna/apple-release-notifier
      deploy_type: job
    secrets: inherit
